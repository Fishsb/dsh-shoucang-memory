# ============================================================
# 守藏 · Shoucang 配置文件模板（单插件版 v3，2026-09-08）
# 单插件 @dsh-external/shoucang：panel（UI）+ scheduler（suite 路由/蒸馏）
# + 内嵌 managing-memory 技能（skill/）。项目未发布过版本，无旧版适配负担。
# 用法: 复制为 shoucang.config.yaml 并按需修改；路径留空=能力禁用。
# ============================================================

shoucang:
  suite:                     # 插件集合管理（suite-manager 模块）
    enabled: true
    members: []              # 2026-09-08 单插件合并：记忆技能已内嵌（skill/）、pmg 治理整体移除；
                             # 外部成员注册表清空。如未来再接成员插件，在此按 id/package/repo/role 登记
    # installChannel: std     # std=dsh plugin add（默认）| dev=注入器（开发机）
    # autoCheck: true         # 装配检测：已装/未装/版本比对

  scheduler:                 # 顶层调度执行器（suite 内部路由 + 状态聚合）
    enabled: true
    gates:                   # 4-Gate 降级复用：suite 成员操作路由（原记忆归档路由退役）
      g0: true               #   准入：非 suite 意图 bypass
      g1: true               #   读：成员状态/装配检测/积压统计
      g2: true               #   写：安装编排/迁移派发（第二批实现）
      g3: true               #   验证：G30 证据计数（对接记忆审计 §8）
    verify:
      enabled: true
      g30:
        enabled: true        # G30 证据计数保留（只数工具实证，不信自述）
    state_dir: ".shoucang"

  embedding:                 # [悬置] 本地向量辅助检索（panel UI 已建；后端接记忆检索另行立项）
    base_url: ""
    model: bge-m3
    dimension: 1024
    api_key: ""
    rerank_url: ""
